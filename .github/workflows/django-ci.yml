name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django project
        run: python manage.py check --settings=book_manage.test_settings

      - name: Run backend tests
        run: python manage.py test book --settings=book_manage.test_settings

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: fontend
        run: npm ci

      - name: Lint frontend
        working-directory: fontend
        run: npm run lint

      - name: Build frontend
        working-directory: fontend
        run: npm run build
