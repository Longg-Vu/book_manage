version: '3.8'

services:
  db:
    image: postgres:15
    container_name: book_manage_postgres
    environment:
      POSTGRES_DB: book_manage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
